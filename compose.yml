services:
  db:
    image: postgis/postgis:17-3.5
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: urbanpulse
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - urbanpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d urbanpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./backend
      target: minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urbanpulse-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urbanpulse-dev-storage}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - urbanpulse-media:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["container"]
    build:
      context: ./backend
      target: api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urbanpulse
      SPRING_DATASOURCE_USERNAME: urbanpulse
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      URBANPULSE_JWT_SECRET: ${URBANPULSE_JWT_SECRET:-}
      URBANPULSE_JWT_ISSUER: ${URBANPULSE_JWT_ISSUER:-urbanpulse}
      URBANPULSE_JWT_AUDIENCE: ${URBANPULSE_JWT_AUDIENCE:-urbanpulse-api}
      URBANPULSE_JWT_TTL_SECONDS: ${URBANPULSE_JWT_TTL_SECONDS:-259200}
      URBANPULSE_CORS_ALLOWED_ORIGINS: ${URBANPULSE_CORS_ALLOWED_ORIGINS:-}
      URBANPULSE_STORAGE_ENDPOINT: http://minio:9000
      URBANPULSE_STORAGE_BUCKET: ${URBANPULSE_STORAGE_BUCKET:-urbanpulse-attachments}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urbanpulse-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urbanpulse-dev-storage}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./.grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  urbanpulse-db:
  urbanpulse-media:
  prometheus-data:
  grafana-data:
