services:
  db:
    image: postgis/postgis:17-3.5
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: urbanpulse
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - urbanpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d urbanpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["container"]
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urbanpulse
      SPRING_DATASOURCE_USERNAME: urbanpulse
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      URBANPULSE_JWT_SECRET: ${URBANPULSE_JWT_SECRET:-}
      URBANPULSE_JWT_ISSUER: ${URBANPULSE_JWT_ISSUER:-urbanpulse}
      URBANPULSE_JWT_AUDIENCE: ${URBANPULSE_JWT_AUDIENCE:-urbanpulse-api}
      URBANPULSE_JWT_TTL_SECONDS: ${URBANPULSE_JWT_TTL_SECONDS:-900}
      URBANPULSE_CORS_ALLOWED_ORIGINS: ${URBANPULSE_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  urbanpulse-db:
