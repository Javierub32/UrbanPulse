spring.application.name=UrbanPulse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urbanpulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urbanpulse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev-only-change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.docker.compose.file=../compose.yml

// To debug
management.endpoints.web.cors.allowed-origins=https://hoppscotch.io
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Base64 de una clave aleatoria de al menos 32 bytes. Obligatoria; nunca se genera al arrancar.
urbanpulse.jwt.secret=${URBANPULSE_JWT_SECRET:}
urbanpulse.jwt.issuer=${URBANPULSE_JWT_ISSUER:urbanpulse}
urbanpulse.jwt.audience=${URBANPULSE_JWT_AUDIENCE:urbanpulse-api}
urbanpulse.jwt.access-token-ttl-seconds=${URBANPULSE_JWT_TTL_SECONDS:259200}
urbanpulse.cors.allowed-origins=${URBANPULSE_CORS_ALLOWED_ORIGINS:}

# Cada endpoint declara sus respuestas reales; evita añadir errores del advice a rutas públicas.
springdoc.override-with-generic-response=false
