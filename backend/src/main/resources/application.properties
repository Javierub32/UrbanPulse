spring.application.name=UrbanPulse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urbanpulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urbanpulse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev-only-change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.docker.compose.file=../compose.yml
# Ejecuta Compose también si PostGIS ya está levantado y falta MinIO.
spring.docker.compose.start.skip=never
spring.docker.compose.lifecycle-management=start-only
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.resolve-lazily=true

urbanpulse.storage.endpoint=${URBANPULSE_STORAGE_ENDPOINT:http://127.0.0.1:9000}
urbanpulse.storage.access-key=${MINIO_ROOT_USER:urbanpulse-dev}
urbanpulse.storage.secret-key=${MINIO_ROOT_PASSWORD:urbanpulse-dev-storage}
urbanpulse.storage.bucket=${URBANPULSE_STORAGE_BUCKET:urbanpulse-attachments}

// To debug
management.endpoints.web.cors.allowed-origins=https://hoppscotch.io
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.exposure.include=health,metrics

# Base64 de una clave aleatoria de al menos 32 bytes. Obligatoria; nunca se genera al arrancar.
urbanpulse.jwt.secret=${URBANPULSE_JWT_SECRET:}
urbanpulse.jwt.issuer=${URBANPULSE_JWT_ISSUER:urbanpulse}
urbanpulse.jwt.audience=${URBANPULSE_JWT_AUDIENCE:urbanpulse-api}
urbanpulse.jwt.access-token-ttl-seconds=${URBANPULSE_JWT_TTL_SECONDS:259200}
urbanpulse.cors.allowed-origins=${URBANPULSE_CORS_ALLOWED_ORIGINS:}

# Cada endpoint declara sus respuestas reales; evita añadir errores del advice a rutas públicas.
springdoc.override-with-generic-response=false

# La integración se activará al asociarla al flujo de incidencias.
urbanpulse.open-meteo.weather-url=${URBANPULSE_OPEN_METEO_WEATHER_URL:https://api.open-meteo.com/v1/forecast}
urbanpulse.open-meteo.air-quality-url=${URBANPULSE_OPEN_METEO_AIR_QUALITY_URL:https://air-quality-api.open-meteo.com/v1/air-quality}
urbanpulse.open-meteo.connect-timeout-ms=${URBANPULSE_OPEN_METEO_CONNECT_TIMEOUT_MS:2000}
urbanpulse.open-meteo.request-timeout-ms=${URBANPULSE_OPEN_METEO_REQUEST_TIMEOUT_MS:4000}